<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; }
    .mark {
      width: 1024px;
      height: 1024px;
      background: #0c0e12;
      display: grid;
      place-items: center;
      position: relative;
    }
    .ring {
      width: 860px;
      height: 860px;
      border: 18px solid #5dffb0;
      border-radius: 50%;
      box-shadow: inset 0 0 0 6px #0c0e12, inset 0 0 0 10px #2a6a52;
      display: grid;
      place-items: center;
    }
    .word {
      font-family: Newsreader, "Iowan Old Style", Georgia, serif;
      font-size: 168px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #e6e8ee;
      line-height: 1;
      margin: 0;
    }
    .word i {
      font-style: italic;
      color: #5dffb0;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="mark">
    <div class="ring">
      <p class="word">B<i>LEAK</i></p>
    </div>
  </div>
</body>
</html>
